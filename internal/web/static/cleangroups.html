<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleangroups Review • Photo Organizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="glass-nav">
        <div class="nav-content">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <h1>Cleangroups Review</h1>
            </div>

            <div class="nav-controls">
                <div class="nav-links">
                    <a class="nav-link" href="/static/">Duplicate Review</a>
                    <a class="nav-link active" href="/static/cleangroups.html">Cleangroups Review</a>
                </div>
                <div class="shortcut-hint">
                    Review rehome and standalone decisions from the structured cleangroups log.
                </div>
            </div>
        </div>
    </header>

    <main class="app-container">
        <section class="glass-panel log-toolbar">
            <div class="log-toolbar-row">
                <label class="log-path-control" for="log-path">
                    <span>Log Path</span>
                    <input id="log-path" type="text" placeholder="cleangroups.log or configured -cleangroups-log">
                </label>
                <button id="load-log" class="primary-btn" type="button">Load Log</button>
            </div>
            <div id="log-status" class="batch-status">Waiting for log load</div>
        </section>

        <section id="log-stats" class="stats-banner glass-panel review-stats">
            <div class="stat">
                <span class="stat-value" id="stat-total">0</span>
                <span class="stat-label">Parsed Events</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-changed">0</span>
                <span class="stat-label">Changed Events</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-rehome">0</span>
                <span class="stat-label">Rehome</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-standalone">0</span>
                <span class="stat-label">Standalone</span>
            </div>
        </section>

        <section class="glass-panel filter-bar">
            <div id="event-filters" class="event-filters"></div>
        </section>

        <section id="summary-panel" class="glass-panel summary-panel">
            <div class="summary-header">
                <h2>Run Summary</h2>
                <span id="summary-mode" class="badge neutral-badge">unknown</span>
            </div>
            <div id="summary-grid" class="summary-grid"></div>
        </section>

        <section id="event-list" class="review-event-list"></section>
    </main>

    <template id="review-event-template">
        <article class="glass-panel review-event">
            <div class="review-event-header">
                <div>
                    <div class="review-event-title"></div>
                    <div class="review-event-subtitle"></div>
                </div>
                <div class="review-event-badges"></div>
            </div>
            <div class="review-event-path"></div>
            <div class="review-event-previews"></div>
            <div class="review-event-fields"></div>
            <pre class="review-event-raw"></pre>
        </article>
    </template>

    <script src="cleangroups.js"></script>
</body>
</html>
