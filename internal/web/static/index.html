<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deduplicate • Photo Organizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="glass-nav">
        <div class="nav-content">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <h1>Photo Cleanup</h1>
            </div>

            <div class="nav-controls">
                <div class="shortcut-hint">
                    Single click switches keep &bull; Double click toggles multi-keep &bull; <kbd>Enter</kbd> Resolve Group &bull; <kbd>Shift</kbd> <kbd>Enter</kbd> Resolve Page
                </div>
            </div>
        </div>
    </header>

    <main class="app-container">
        <div id="stats-banner" class="stats-banner glass-panel">
            <div class="stat">
                <span class="stat-value" id="total-groups">0</span>
                <span class="stat-label">Duplicate Groups</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="pot-space">0 MB</span>
                <span class="stat-label">Visible Savings</span>
            </div>
        </div>

        <div id="groups-container" class="groups-container">
            <div class="loading-state" id="loading-indicator">
                <div class="spinner"></div>
                <p>Analyzing duplicate clusters...</p>
            </div>
        </div>

        <div class="pagination-controls glass-panel" id="pagination">
            <div class="pagination-top-row">
                <label class="page-size-control" for="page-size">
                    <span>Page Size</span>
                    <input id="page-size" type="number" min="1" max="2000" step="1" value="25" inputmode="numeric">
                </label>

                <div class="page-batch-actions">
                    <button id="resolve-page" class="primary-btn" type="button">Resolve 0 Groups on This Page</button>
                    <span id="batch-status" class="batch-status">No groups loaded</span>
                </div>
            </div>

            <div class="pagination-bottom-row">
                <button id="prev-page" type="button" disabled>Previous</button>
                <div id="page-numbers" class="page-numbers"></div>
                <span id="page-info">Page 1 of 1</span>
                <button id="next-page" type="button" disabled>Next</button>
            </div>
        </div>
    </main>

    <template id="group-template">
        <div class="duplicate-group glass-panel">
            <div class="group-header">
                <div class="group-title-wrap">
                    <h3 class="group-title">Visual Cluster</h3>
                    <span class="group-summary"></span>
                </div>
                <div class="group-actions">
                    <button class="download-btn" type="button">Download Tar</button>
                    <button class="resolve-btn primary-btn" type="button">Resolve Group</button>
                </div>
            </div>
            <div class="images-grid"></div>
        </div>
    </template>

    <template id="image-card-template">
        <div class="image-card" tabindex="0">
            <div class="image-wrapper">
                <img loading="lazy" src="" alt="Duplicate image">
                <div class="selection-overlay">
                    <div class="check-icon">✓ KEEP</div>
                </div>
                <div class="badge-container">
                    <span class="badge master-badge">MASTER</span>
                    <span class="badge auto-badge">AUTO-SELECTED</span>
                </div>
            </div>
            <div class="meta-pill">
                <div class="meta-row main-meta">
                    <span class="resolution"></span>
                    <span class="dot">&bull;</span>
                    <span class="size"></span>
                </div>
                <div class="meta-row sub-meta">
                    <span class="path"></span>
                </div>
                <div class="meta-row sub-meta">
                    <span class="date"></span>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
